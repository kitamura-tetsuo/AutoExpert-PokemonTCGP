name: PR Deck-Specialized Win Rate Check

on:
  pull_request:
    branches-ignore:
      - main

jobs:
  vs-past-deck-check:
    if: "!startsWith(github.base_ref, 'student_vs_teacher/')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Allocate Swap Space
        run: |
          sudo fallocate -l 4G /swapfile-extra
          sudo chmod 600 /swapfile-extra
          sudo mkswap /swapfile-extra
          sudo swapon /swapfile-extra
          sudo systemctl stop systemd-oomd || true
          free -h

      - name: Install dependencies
        env:
          CARGO_BUILD_JOBS: 1
          UV_CONCURRENCY: 1
          UV_HTTP_TIMEOUT: 300
        run: |
          uv sync --verbose

      - name: Prepare past AI (1 commit before HEAD)
        run: |
          git worktree add past_repo_main HEAD~1

      - name: Run Deck-Specialized VS Past Check
        run: |
          uv run python vs_past_deck.py \
            --past_dir past_repo \
            --deck_a train_data/${{ github.base_ref || github.ref_name }}.txt \
            --num_matches 1000 \
            --threshold 0.01 \
            --league_decks_teacher train_data/teacher.csv
