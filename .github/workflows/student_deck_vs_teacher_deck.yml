name: Student Deck vs Teacher Deck Strategy Exploration

on:
  pull_request:
    branches:
      - "**"
    paths-ignore:
      - "README.md"
      - "docs/**"

jobs:
  explore-specialized-strategy:
    if: "startsWith(github.head_ref, 'student_vs_teacher/')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        env:
          CARGO_HTTP_MULTIPLEXING: "false"
        run: |
          uv sync
          uv pip install -e ./deckgym-core

      - name: Prepare past AI (1 commit before HEAD)
        run: |
          git worktree add past_repo HEAD~1

      - name: Run Deck-Specialized VS Past Check
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          DECKS_PART="${BRANCH_NAME#student_vs_teacher/}"
          
          # Remove UUID/timestamp suffix if present (e.g. -8427737067298463983)
          DECKS_PART=$(echo "$DECKS_PART" | sed -E 's/-[0-9]+$//')

          if [[ "$DECKS_PART" == *"_vs_"* ]]; then
            STUDENT="${DECKS_PART%_vs_*}"
            TEACHER="${DECKS_PART#*_vs_}"
          else
            STUDENT="$DECKS_PART"
            TEACHER="teacher"
          fi
          
          # Ensure extensions
          if [[ "$STUDENT" != *.txt ]]; then STUDENT="${STUDENT}.txt"; fi
          if [[ "$TEACHER" != *.txt ]] && [[ "$TEACHER" != *.csv ]]; then TEACHER="${TEACHER}.txt"; fi
          
          uv run python vs_past_deck.py \
            --past_dir past_repo \
            --deck_a "train_data/$STUDENT" \
            $( [[ "$TEACHER" == *.csv ]] && echo "--league_decks_teacher train_data/$TEACHER" || echo "--deck_b train_data/$TEACHER" ) \
            --num_matches 1000 \
            --threshold 0.01
